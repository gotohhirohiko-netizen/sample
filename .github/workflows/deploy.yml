name: Deploy web apps to GitHub Pages

on:
  push:
    # このリポジトリには main ブランチが無く、デフォルトブランチが
    # claude/household-budget-app-6ad06r になっているため、それに合わせている。
    # main運用に切り替えた場合はここも更新すること。
    branches: [claude/household-budget-app-6ad06r]
    paths:
      - "web/**"
      - "child-tasklist/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            child-tasklist/package-lock.json

      - name: Build 家計簿アプリ (web/)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build 遠征タスクリストアプリ (child-tasklist/)
        working-directory: child-tasklist
        env:
          VITE_SUPABASE_URL: ${{ secrets.CHILD_TASKLIST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.CHILD_TASKLIST_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.CHILD_TASKLIST_VAPID_PUBLIC_KEY }}
        run: |
          npm ci
          npm run build

      - name: Combine build outputs
        run: |
          mkdir -p pages
          cp -r web/dist/. pages/
          mkdir -p pages/child-tasklist
          cp -r child-tasklist/dist/. pages/child-tasklist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
